[package]
name = "studiorecorder"
version = "0.7.0"
edition = "2024"
rust-version = "1.91"
build = "build.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.18"
flacenc = "0.5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
crossbeam-channel = "0.5"
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
mp3lame-encoder = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Storage_FileSystem", "Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
claxon = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Linux build is only used for development/testing.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }

# Optimise dependencies in debug builds too (Argon2, FLAC and MP3 are slow otherwise).
[profile.dev.package."*"]
opt-level = 2
